<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频转码管理系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-dark: #4338ca;
            --success-color: #059669;
            --warning-color: #d97706;
            --danger-color: #dc2626;
            --info-color: #2563eb;
            --bg-primary: #f8fafc;
            --bg-secondary: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.9);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #eef2ff 100%);
            color: var(--text-primary);
            padding: 20px;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding: 20px 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #818cf8 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color) 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-secondary);
            transform: translateY(-1px);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success-color) 0%, #059669 100%);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-warning {
            background: linear-gradient(135deg, var(--warning-color) 0%, #d97706 100%);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger-color) 0%, #dc2626 100%);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 12px;
            border-radius: 8px;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .panel {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            transition: var(--transition);
        }

        .panel:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 30px -5px rgba(0, 0, 0, 0.15);
        }

        .panel h2 {
            color: var(--text-primary);
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 24px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color) 0%, #818cf8 100%);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.1);
        }

        .stat-card h3 {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card p {
            color: var(--text-primary);
            font-size: 32px;
            font-weight: 700;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 15px;
            color: var(--text-primary);
            transition: var(--transition);
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .help-text {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        code {
            background: #f1f5f9;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-family: 'Fira Code', 'Consolas', monospace;
            color: #4f46e5;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            background: var(--bg-secondary);
            padding: 16px 20px;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
        }

        /* 复选框样式 */
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition);
        }

        tbody tr:hover {
            background: rgba(99, 102, 241, 0.05);
        }

        .status {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            gap: 6px;
        }

        .status::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning-color);
        }

        .status-pending::before {
            background: var(--warning-color);
        }

        .status-running {
            background: rgba(59, 130, 246, 0.15);
            color: var(--info-color);
        }

        .status-running::before {
            background: var(--info-color);
            animation: pulse 2s infinite;
        }

        .status-completed {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
        }

        .status-completed::before {
            background: var(--success-color);
        }

        .status-failed {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger-color);
        }

        .status-failed::before {
            background: var(--danger-color);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            background: var(--bg-secondary);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .tab {
            flex: 1;
            padding: 12px 20px;
            cursor: pointer;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .tab.active {
            color: white;
            background: var(--primary-color);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .tab:hover:not(.active) {
            background: rgba(99, 102, 241, 0.05);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-row {
            display: flex;
            gap: 20px;
            align-items: end;
        }

        .flex-1 {
            flex: 1;
        }

        .flex-2 {
            flex: 2;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            z-index: 1000;
            overflow: auto;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .modal.visible {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            margin: 50px auto;
            transition: var(--transition);
            transform: translateY(20px) scale(0.95);
        }

        .modal.visible .modal-content {
            transform: translateY(0) scale(1);
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message {
            margin-bottom: 20px;
            padding: 16px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            animation: slideIn 0.3s ease-out;
            border-left: 4px solid;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.05);
            color: var(--danger-color);
            border-color: var(--danger-color);
        }

        .message.success {
            background: rgba(16, 185, 129, 0.05);
            color: var(--success-color);
            border-color: var(--success-color);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
        }

        .icon-btn:hover {
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .action-buttons {
                flex-direction: column;
                gap: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header fade-in">
            <div class="logo">
                <div class="logo-icon">▶</div>
                <h1>视频转码管理系统</h1>
            </div>
            <button type="button" class="btn btn-secondary" onclick="openSettingsModal()" title="系统设置">
                ⚙️ 系统设置
            </button>
        </div>

        <!-- 统计信息 -->
        <div class="panel fade-in">
            <h2>📊 系统状态</h2>
            <input type="hidden" id="concurrency" value="2">
            <div class="stats" id="stats">
                <div class="stat-card">
                    <h3>总任务数</h3>
                    <p id="total-tasks">-</p>
                </div>
                <div class="stat-card">
                    <h3>排队中</h3>
                    <p id="pending-tasks">-</p>
                </div>
                <div class="stat-card">
                    <h3>运行中</h3>
                    <p id="running-tasks">-</p>
                </div>
                <div class="stat-card">
                    <h3>已完成</h3>
                    <p id="completed-tasks">-</p>
                </div>
            </div>
        </div>

        <!-- 添加任务 -->
        <div class="panel fade-in">
            <h2 id="form-title">🎬 创建视频转码任务</h2>
            <div id="message"></div>

            <!-- Tab 切换 -->
            <div class="tabs">
                <button class="tab active" data-tab="transcode">🎬 视频转码</button>
                <button class="tab" data-tab="command">⚡ 执行命令</button>
            </div>

            <form id="task-form">
                <div class="tab-content active" id="tab-transcode">
                    <div class="form-group">
                        <label for="input-file">输入文件名</label>
                        <input type="text" id="input-file" placeholder="例如: a.mp4" required>
                        <p class="help-text">只需提供文件名，不包含路径。文件必须存在于配置的 <code>INPUT_DIR</code> 目录中。</p>
                    </div>
                    <div class="form-group">
                        <label for="bitrate">视频码率（可选）</label>
                        <input type="number" id="bitrate" placeholder="4500" min="100" max="50000" step="100" value="4500" style="width: 200px;">
                        <p class="help-text">输入数字（单位：kbps）。例如: 4500 表示 4500kbps。留空则使用默认值。</p>
                    </div>
                </div>

                <div class="tab-content" id="tab-command">
                    <div class="form-group">
                        <label for="command">Shell 命令</label>
                        <textarea id="command" placeholder="输入要执行的命令..."></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label for="timeout">超时时间（秒）</label>
                            <input type="number" id="timeout" placeholder="300" min="1" max="3600" value="300" style="width: 200px;">
                            <p class="help-text">命令执行的超时时间（1-3600秒），默认300秒。</p>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="submit-btn">
                    ➕ 添加转码任务
                </button>
            </form>
        </div>

        <!-- 任务列表 -->
        <div class="panel fade-in">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>📋 任务列表</h2>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <span id="selected-count" style="color: var(--text-secondary); font-size: 14px; display: none;">已选择 0 项</span>
                    <button type="button" id="batch-delete-btn" class="btn btn-sm btn-danger" onclick="batchDeleteTasks()" style="display: none;" title="批量删除选中的任务">
                        🗑️ 批量删除
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="loadTasks()" title="刷新任务列表">
                        🔄 刷新
                    </button>
                </div>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 50px; text-align: center;"><input type="checkbox" id="select-all" onchange="toggleSelectAll()"></th>
                            <th style="width: 100px;">任务ID</th>
                            <th style="width: 80px;">类型</th>
                            <th style="width: 100px;">状态</th>
                            <th style="width: 150px;">开始时间</th>
                            <th style="width: 150px;">用时</th>
                            <th style="width: 140px;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="task-list">
                        <tr>
                            <td colspan="7" style="text-align: center; color: var(--text-secondary); padding: 40px;">
                                加载中...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 隐藏的并发数输入框 -->
    <input type="hidden" id="concurrency" value="2">

    <!-- 任务详情模态框 -->
    <div id="task-modal" class="modal">
        <div class="modal-content" style="max-width: 900px; padding: 32px; margin: 50px auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <h3 id="modal-title" style="font-size: 24px; font-weight: 600;">任务详情</h3>
                <div style="display: flex; gap: 12px;">
                    <button id="modal-delete-btn" class="btn btn-danger" style="display: none;">
                        🗑️ 删除任务
                    </button>
                    <button onclick="closeModal()" class="btn btn-secondary">
                        ✕ 关闭
                    </button>
                </div>
            </div>
            <div id="modal-content" style="font-family: 'Fira Code', monospace; font-size: 14px; line-height: 1.8; background: var(--bg-primary); padding: 24px; border-radius: 12px; border: 1px solid var(--border-color); max-height: 500px; overflow-y: auto; white-space: pre-wrap;">
                加载中...
            </div>
        </div>
    </div>

    <!-- 系统设置模态框 -->
    <div id="settings-modal" class="modal">
        <div class="modal-content" style="max-width: 500px; padding: 32px; margin: 100px auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <h3 style="font-size: 24px; font-weight: 600;">系统设置</h3>
                <button onclick="closeSettingsModal()" class="btn btn-secondary" style="padding: 8px 16px;">✕</button>
            </div>
            <div class="form-group">
                <label for="concurrency-modal">最大并发数</label>
                <div style="display: flex; gap: 12px; align-items: end;">
                    <input type="number" id="concurrency-modal" placeholder="2" min="1" max="1000" value="2" style="width: 200px;">
                    <button type="button" class="btn btn-primary" onclick="saveConcurrency()">保存</button>
                </div>
                <p class="help-text">同时运行的最大任务数（1-1000）</p>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
